name: Playwright E2E Multi-Role CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  e2e-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Production App
        run: npm run build

      - name: Run Playwright Multi-Role E2E Test Suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
