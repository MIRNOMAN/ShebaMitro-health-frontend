<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="sm-brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Medical Pulse Gradient -->
    <linearGradient id="sm-pulse-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="sm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-contrast Badge Background -->
  <rect width="100" height="100" rx="22" fill="#091424" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#00C49F" stroke-width="2" stroke-opacity="0.35" />

  <!-- Outer M / Heart Outline -->
  <path
    d="M 21,47 C 21,24 35,16 46,33 C 49,38 51,38 54,33 C 65,16 79,24 79,47"
    stroke="url(#sm-brand-gradient)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Supporting Care Hand at Bottom -->
  <path
    d="M 19,51 C 23,65 37,77 50,77 C 63,77 77,65 81,55 C 71,65 57,67 48,61 C 38,55 26,55 19,51 Z"
    stroke="url(#sm-brand-gradient)"
    stroke-width="4.5"
    fill="url(#sm-brand-gradient)"
    fill-opacity="0.28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Medical Cross -->
  <path
    d="M 50,29 V 47 M 41,38 H 59"
    stroke="#38BDF8"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- ECG Heartbeat Pulse Line -->
  <path
    d="M 56,38 L 62,38 L 66,29 L 71,46 L 75,35 L 79,38 L 88,38"
    stroke="#F97316"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>